networks:
  app_net:
    driver: bridge

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simulador_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:3001"
    container_name: simulador_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - app_net
    depends_on:
      - backend
